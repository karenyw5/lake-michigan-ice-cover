<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="style.css"/>
</head><body>
<section class="controls" aria-label="Ice-cover timeline">
<div class="metric-control"><label for="metric">Ice-cover metric</label><select id="metric"><option value="max">Annual maximum (NOAA)</option><option value="mean" id="meanOption">December–May mean (GLAHF)</option></select></div>
<div class="topline"><div><span class="label">Year</span><strong id="yearLabel">—</strong></div><div class="summary"><span id="peakDate">—</span><strong id="cover">—</strong></div></div>
<div class="timeline"><button id="play" type="button" aria-label="Play timeline">▶</button><input id="year" type="range" min="1973" max="2026" step="1" value="2025" aria-label="Year slider" disabled/><div class="ends"><span id="minYear">—</span><span id="maxYear">—</span></div></div>
<div class="options"><label><input type="checkbox" id="spawning" checked/> Whitefish spawning grounds</label><span id="spawningNote"></span></div><div id="status" role="status" aria-live="polite"></div>
</section>
<main><section class="map-shell" aria-label="Interactive ice-cover map"><div id="map"></div><div class="legend" aria-label="Ice concentration legend"><strong>Ice concentration</strong><div class="swatches"><span style="background:#b8e2f7"></span><span style="background:#7dc1e7"></span><span style="background:#4695cf"></span><span style="background:#1667a6"></span><span style="background:#0b3771"></span></div><div class="labels"><span>0%</span><span>100%</span></div></div></section></main>
<footer>Spawning locations: Conservation Biology Institute (historic). NOAA GLERL: concentration on Lake Michigan's annual maximum date. GLAHF: mean ice concentration for the December–May winter season.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="app.js"></script>
</body></html>
